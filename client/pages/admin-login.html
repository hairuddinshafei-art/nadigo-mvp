<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NadiGo Admin Login</title>


    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/home.css">


    <style>

        .admin-login-page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            box-sizing: border-box;

        }


        .admin-login-card {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);

            box-sizing: border-box;

        }


        .admin-login-card h1 {

            margin: 0 0 8px;

            text-align: center;

        }


        .admin-login-card p {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

        }


        .admin-form-group {

            margin-bottom: 20px;

        }


        .admin-form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;

        }


        .admin-form-group input {

            width: 100%;

            height: 48px;

            padding: 0 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            box-sizing: border-box;

            outline: none;

        }


        .admin-form-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.08);

        }


        .admin-login-btn {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .admin-login-btn:hover {

            background: #1d4ed8;

        }


        #loginError {

            color: #d93025;

            text-align: center;

            font-size: 14px;

            margin-top: 15px;

        }

    </style>

</head>


<body>


<section class="admin-login-page">


    <div class="admin-login-card">


        <h1>
            NadiGo Admin
        </h1>


        <p>
            Login to manage your orders
        </p>


        <form
            id="adminLoginForm"
        >


            <div class="admin-form-group">

                <label for="adminEmail">
                    Email
                </label>


                <input
                    type="email"
                    id="adminEmail"
                    placeholder="admin@nadigo.com"
                    required
                >

            </div>



            <div class="admin-form-group">

                <label for="adminPassword">
                    Password
                </label>


                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    required
                >

            </div>



            <button
                type="submit"
                class="admin-login-btn"
            >
                Login
            </button>


            <p id="loginError"></p>


        </form>


    </div>


</section>

<script>

document
    .getElementById("adminLoginForm")
    .addEventListener("submit", function(event){

        event.preventDefault();


        const email =
            document.getElementById("adminEmail").value.trim();


        const password =
            document.getElementById("adminPassword").value;


        const error =
            document.getElementById("loginError");


        error.innerHTML = "";


        fetch("http://localhost:3000/admin/login", {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body: JSON.stringify({

                email: email,

                password: password

            })

        })


        .then(response => {

            return response.json();

        })


        .then(data => {

            console.log(
                "LOGIN RESPONSE:",
                data
            );


            if(data.token){

                localStorage.setItem(
                    "nadigoAdminToken",
                    data.token
                );


                window.location.href =
                    "dashboard.html";

            }

            else{

                error.innerHTML =
                    data.message ||
                    "Login gagal.";

            }

        })


        .catch(error => {

            console.log(error);


            document.getElementById(
                "loginError"
            ).innerHTML =
                "Tidak dapat sambung ke server.";

        });

    });

</script>

</body>

</html>
